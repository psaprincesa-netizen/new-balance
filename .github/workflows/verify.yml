name: Verify DRAP office
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Pinned: Playwright 1.55 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt playwright==1.55.0
      - run: npm run build && npm test && npm run check
      - run: python -m unittest discover -v
      - run: python -m playwright install --with-deps chromium
      - name: Test real editor journeys
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m tests.browser_smoke
          python -m tests.browser_features
          python -m tests.browser_spreadsheet
          python -m tests.browser_ribbon
          python -m tests.browser_pivots
          python -m tests.browser_slides
          python -m tests.browser_workflows
          python -m tests.browser_document
          python -m tests.browser_google_tools
          python -m tests.browser_insert
          python -m tests.browser_install
          python -m tests.browser_library
          python -m tests.browser_advanced
          python -m tests.browser_pwa
          python -m tests.browser_recovery
          python -m tests.browser_projects
          python -m tests.browser_quiz
          python -m tests.browser_security
          python -m tests.browser_sheet_links
          python -m tests.browser_stage2
          python -m tests.browser_home_tools
          python -m tests.browser_file_delete
          python -m tests.browser_table_relations
          python -m tests.browser_diagrams
          python -m tests.browser_ai
          python -m tests.browser_form_conditions
          python -m tests.browser_automations
          python -m tests.browser_dashboards
          python -m tests.browser_approvals
          python -m tests.browser_notifications
          python -m tests.browser_schedules
