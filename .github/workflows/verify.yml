name: Verify DRAP office
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt playwright==1.55.0
      - run: npm run build && npm test && npm run check
      - run: python -m unittest discover -v
      - run: python -m playwright install --with-deps chromium
      - name: Test real editor journeys
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python -m tests.browser_smoke
          python -m tests.browser_features
          python -m tests.browser_spreadsheet
          python -m tests.browser_pivots
